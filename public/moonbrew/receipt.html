<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Moonbrew Magic Café — Receipt</title><link rel="stylesheet" href="receipt.css"></head>
<body><nav class="toolbar" aria-label="จัดการใบเสร็จ"><button id="edit" class="secondary">แก้ไขข้อมูล</button><button id="print">พิมพ์ / บันทึก PDF</button><button id="reset" class="secondary">คืนค่าตัวอย่าง</button><span>Moonbrew Magic Café</span></nav>
<section id="editor" class="editor" hidden><h2>ข้อมูลใบเสร็จ</h2><form id="receipt-form"><div class="fields">
<label>เลขที่ใบเสร็จ<input name="number" required maxlength="80"></label><label>วันที่<input name="date" required></label><label>เวลา<input name="time" required></label><label>พนักงาน<input name="staff" required></label><label>โต๊ะ<input name="table" required></label><label>ชำระโดย<input name="paymentMethod" required></label><label>สถานะ<input name="status" required></label><label>ส่วนลด<input name="discount" type="number" min="0" step="0.01" required></label><label>ภาษี (%)<input name="taxRate" type="number" min="0" max="100" step="0.01" required></label></div>
<table><thead><tr><th>สินค้า</th><th>จำนวน</th><th>ราคาต่อหน่วย</th><th></th></tr></thead><tbody id="item-inputs"></tbody></table><p class="hint">ช่องราคาในใบเสร็จแสดงยอดรวมของแต่ละรายการ • เกิน 4 รายการจะแบ่งหน้า โดยยอดสุทธิแสดงหน้าสุดท้าย</p><div class="actions"><button type="button" id="add">+ เพิ่มสินค้า</button><button type="submit">ออกใบเสร็จ</button></div><p id="error" role="alert"></p></form></section>
<main id="pages"></main><script src="receipt.js"></script></body></html>
